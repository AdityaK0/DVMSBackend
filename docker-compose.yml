version: "3.9"

services:
  db:
    image: postgres:15
    container_name: drf_postgres
    restart: always
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: drf_redis
    restart: always
    ports:
      - "6380:6379"   # external:internal mapping (different from default 6379)
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  celery:
    build: .
    container_name: drf_personal_celery
    restart: always
    command: celery -A apps.core worker -l info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://host.docker.internal:6380/0
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6380/0


  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis    



volumes:
  postgres_data:
  redis_data:
  celery_data:



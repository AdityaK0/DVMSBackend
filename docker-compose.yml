version: "3.9"

services:
  db:
    image: postgres:15
    container_name: drf_postgres
    restart: always
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: drf_redis
    restart: always
    ports:
      - "6380:6379"   # external:internal mapping (different from default 6379)
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
